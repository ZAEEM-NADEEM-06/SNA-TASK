<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Login</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: Arial, sans-serif; background: #f2f4f8; color: #222;
    }
    .card {
      width: min(360px, 92vw); padding: 28px; background: white;
      border-radius: 12px; box-shadow: 0 8px 28px #00000012;
    }
    h2 { margin-top: 0; text-align: center; }
    label { display: block; margin: 14px 0 6px; font-size: 14px; }
    input {
      width: 100%; padding: 11px; border: 1px solid #ccd1d9;
      border-radius: 7px; font-size: 15px;
    }
    button {
      width: 100%; margin-top: 18px; padding: 11px; border: 0;
      border-radius: 7px; background: #2457d6; color: white;
      font-size: 15px; cursor: pointer;
    }
    #message { text-align: center; margin-bottom: 0; }
    .error { color: #c62828; }
    .success { color: #16803c; }
  </style>
</head>
<body>
  <main class="card">
    <h2>Login</h2>
    <form id="loginForm">
      <label for="username">Username</label>
      <input id="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log In</button>
    </form>
    <p id="message" role="status"></p>
  </main>

  <script>
    // Demo credentials only. Do not use this approach for real accounts.
    const users = {
      "user1": "pass123",
      "user2": "pass456",
      "user3": "pass789",
      "user4": "pass000"
    };

    document.getElementById("loginForm").addEventListener("submit", function (event) {
      event.preventDefault();
      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (users[username] && users[username] === password) {
        message.className = "success";
        message.textContent = "Logged in as " + username;
        console.log("Logged in as " + username);
      } else {
        message.className = "error";
        message.textContent = "Invalid username or password.";
      }
    });
  </script>
</body>
</html>
